apiVersion: v1
kind: Service
metadata:
  name: asset-gateway
  namespace: cloud-console
  labels:
    app: asset-gateway
spec:
  selector:
    app: asset-gateway
  ports:
    - {name: http, port: 8095, targetPort: 8095}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asset-gateway
  namespace: cloud-console
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asset-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}

# /assets/* 的对外路由由网关仓库统一声明（gateway/infra/k8s/gateway.yaml 的
# gateway-dynamic ConfigMap），本仓库不再自带 IngressRoute：原来那份引用了不存在的
# websecure entryPoint 与 console-auth middleware，且网关未启用 kubernetesCRD provider，
# 从未被读取；同时资产分发是公开路由，不走 forwardAuth。
